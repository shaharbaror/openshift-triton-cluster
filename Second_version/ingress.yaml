apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: triton-combined-ingress
  annotations:
    # Forces HTTPS redirection on OpenShift / Nginx controllers
    ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: openshift-default  # Uses default cluster router (or 'nginx' if using Nginx Ingress Controller)
  rules:
  - host: triton-app.apps.your-cluster.domain.com
    http:
      paths:
      # 1. Route API requests starting with /v2 to Triton
      - path: /v2
        pathType: Prefix
        backend:
          service:
            name: triton-service
            port:
              number: 8000

      # 2. Catch-all: Route web app requests to Frontend Nginx
      - path: /
        pathType: Prefix
        backend:
          service:
            name: triton-web-service
            port:
              number: 8080